<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bullpen · haptics test</title>
<!--
  A THROWAWAY diagnostic, not part of the game.

  Bullpen's swipe haptics do not fire on Ruta's iPhone (iOS 18.7, inside the
  window where the switch trick is supposed to work). Before rebuilding the
  board's input layer around an overlaid switch — which would mean giving up the
  preventDefault() and setPointerCapture() that drag painting and iOS zoom
  suppression both depend on — this answers the prior question: does a real
  finger landing on a real switch produce a haptic on this device AT ALL?

  Two paths, side by side:
    A  a real switch overlaying the button, tapped directly by the finger. This
       is what every working library does, and what the board rework would need.
    B  a hidden switch clicked from script, which is what the game does today
       and what appears not to work.

  Each button counts its taps, so "nothing happened" can be told apart from
  "the tap registered but there was no buzz".

  Delete this file once the question is settled.
-->
<style>
  :root {
    --bg: #F3EAD6; --card: #FBF5E8; --rule: #6E2639; --ink: #6E2639;
    --serif: Georgia, serif;
    --sans: -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 18px 60px; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.5;
  }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 4px; }
  p { font-size: 14px; margin: 0 0 18px; opacity: .8; }
  .pad { max-width: 430px; margin: 0 auto; }
  .test {
    position: relative; display: block; width: 100%; min-height: 96px;
    background: var(--card); border: 2px solid var(--rule); border-radius: 14px;
    margin-bottom: 16px; padding: 14px 16px; text-align: left;
    font-family: var(--serif); font-size: 17px; color: inherit;
  }
  .test small { display: block; font-family: var(--sans); font-size: 12.5px; opacity: .7; margin-top: 4px; }
  .count {
    position: absolute; right: 14px; top: 12px; font-family: var(--sans);
    font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums;
  }
  /* THE POINT OF TEST A: a real switch, covering the whole button, that the
     finger lands on directly. Nearly transparent rather than invisible, and
     with pointer events left on — anything that reads as "not interactive"
     risks WebKit skipping the haptic. */
  .test input[switch] {
    /* -2px, not 0: an absolutely positioned child is laid out against the
       PADDING box, which stops short of the border — leaving a live 2px rim
       where the finger would miss the switch and the test would look broken. */
    position: absolute; inset: -2px; width: auto; height: auto;
    opacity: 0.01; margin: 0; appearance: none; -webkit-appearance: none;
  }
  .note { font-size: 12.5px; opacity: .65; border-top: 1px solid rgba(110,38,57,.2); padding-top: 14px; }
  code { font-size: 12px; background: #E7DCC2; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="pad">
  <h1>Haptics test</h1>
  <p>Tap each button once or twice. The number counts your taps, so you can tell a
     dead button from a button that works but does not buzz.</p>

  <label class="test" id="a">
    <span class="count" id="a-n">0 taps</span>
    A · Real switch under your finger
    <small>What every working library does. This is the one that matters.</small>
    <input type="checkbox" switch>
  </label>

  <button class="test" id="b" type="button">
    <span class="count" id="b-n">0 taps</span>
    B · Hidden switch, clicked by script
    <small>What Bullpen does today. Expected to stay silent.</small>
  </button>

  <p class="note" id="env">reading device…</p>
</div>

<script>
  /* B's lever: the hidden-and-clicked approach, exactly as the game does it. */
  var lever = document.createElement("label");
  lever.setAttribute("aria-hidden", "true");
  lever.style.cssText = "position:fixed;left:-200px;top:0;width:44px;height:26px;opacity:0.01";
  var box = document.createElement("input");
  box.type = "checkbox";
  box.setAttribute("switch", "");
  lever.appendChild(box);
  document.body.appendChild(lever);

  var an = 0, bn = 0;
  /* Counted from the switch's own `change`, not the label's click: a click on a
     label is forwarded to its control and bubbles back, so counting clicks
     scored every tap twice. `change` is also the truer signal — it means the
     switch actually toggled, which is the thing the haptic hangs off. */
  document.querySelector("#a input[switch]").addEventListener("change", function () {
    document.getElementById("a-n").textContent = (++an) + " taps";
  });
  document.getElementById("b").addEventListener("click", function () {
    document.getElementById("b-n").textContent = (++bn) + " taps";
    lever.click();
  });

  var ua = navigator.userAgent || "";
  var m = /(?:iPhone )?OS (\d+)[._](\d+)/.exec(ua);
  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  document.getElementById("env").textContent =
    "iOS " + (m ? m[1] + "." + m[2] : "?") +
    " · switch property " + (typeof box.switch === "boolean" ? "present" : "absent") +
    " · " + (standalone ? "home-screen app" : "Safari") +
    " · vibrate API " + (typeof navigator.vibrate === "function" ? "yes" : "no");
</script>
</body>
</html>
